name: Build frontend static

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm 9.15.0
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Show versions
        run: |
          node -v
          pnpm -v

      - name: Install dependencies
        run: pnpm install --prod=false

      - name: Build frontend static output
        env:
          CI: "true"
          NODE_ENV: "production"
          EXPO_PUBLIC_DOMAIN: "style-scan-app.vercel.app"
          EXPO_PUBLIC_API_BASE_URL: "https://image-code-genapi.onrender.com"
          EXPO_USE_EXOTIC: "1"
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: pnpm --filter @workspace/stylescan-app build

      - name: Commit built files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pnpm-lock.yaml
          git add artifacts/stylescan-app/static-build
          git commit -m "Add lockfile and prebuilt frontend static output" || echo "No changes to commit"
          git push
