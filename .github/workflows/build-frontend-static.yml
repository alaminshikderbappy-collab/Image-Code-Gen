name: Build StyleScan Web App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      CI: "true"
      NODE_ENV: "production"
      EXPO_PUBLIC_DOMAIN: "stylescana.onrender.com"
      EXPO_PUBLIC_API_BASE_URL: "https://image-code-genapi.onrender.com"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Install dependencies
        run: pnpm install --prod=false

      - name: Build Web App
        # This command creates a 'dist' folder with the actual website
        run: pnpm --filter @workspace/stylescan-app exec expo export --platform web

      - name: Commit Web Files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # We move the 'dist' to 'static-build' so your current Render setup works
          rm -rf artifacts/stylescan-app/static-build
          cp -r artifacts/stylescan-app/dist artifacts/stylescan-app/static-build
          git add artifacts/stylescan-app/static-build
          git commit -m "Deploy StyleScan Real Web App" || echo "No changes"
          git push
